
name: Release Build (signed AAB)

# Production release workflow.
# Runs manually or when a v* tag is pushed.
# Does not upload automatically to Google Play.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run regression tests
        run: flutter test

      # -------------------------------------------------
      # Decode the production keystore.
      # -------------------------------------------------
      - name: Decode keystore from GitHub Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/release.keystore

          if [ ! -s android/release.keystore ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

      # -------------------------------------------------
      # Validate the store password, key alias and
      # private-key password before building the app.
      # -------------------------------------------------
      - name: Validate release keystore credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: One or more signing secrets are missing."
            exit 1
          fi

          keytool -list \
            -keystore android/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          keytool -certreq \
            -keystore android/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/release-key-test.csr" \
            >/dev/null

          rm -f "$RUNNER_TEMP/release-key-test.csr"

          echo "Release keystore credentials validated."

      # -------------------------------------------------
      # Write key.properties.
      # -------------------------------------------------
      - name: Write key.properties from GitHub Secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "$KEYSTORE_PASSWORD" \
            "$KEY_PASSWORD" \
            "$KEY_ALIAS" > android/key.properties

      # -------------------------------------------------
      # Build release artifacts.
      # -------------------------------------------------
      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Build Release APK for testing
        run: flutter build apk --release

      - name: Confirm AAB was produced
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: Release AAB was not produced."
            exit 1
          fi

          echo "Release AAB successfully produced."
          du -h "$AAB_PATH"

      # -------------------------------------------------
      # Download the official bundletool release.
      # -------------------------------------------------
      - name: Download bundletool
        run: |
          set -euo pipefail

          BUNDLETOOL_URL="$(
            curl -fsSL \
              https://api.github.com/repos/google/bundletool/releases/latest \
              | jq -r \
                '[.assets[] | select(.name | test("^bundletool-all-.*\\.jar$"))][0].browser_download_url // empty'
          )"

          if [ -z "$BUNDLETOOL_URL" ]; then
            echo "ERROR: Could not find the bundletool JAR."
            exit 1
          fi

          curl -fL --retry 3 \
            "$BUNDLETOOL_URL" \
            -o bundletool.jar

          if [ ! -s bundletool.jar ]; then
            echo "ERROR: Downloaded bundletool file is empty."
            exit 1
          fi

          java -jar bundletool.jar version

      # -------------------------------------------------
      # Verify the AAB signature against the configured
      # release certificate. No universal APK needed.
      # -------------------------------------------------
      - name: Verify AAB release signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          EXPECTED_CERT_SHA256="$(
            keytool -exportcert \
              -keystore android/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{print $1}'
          )"

          jarsigner -verify "$AAB_PATH"

          AAB_CERT_SHA256="$(
            keytool -printcert -jarfile "$AAB_PATH" \
              | awk '/SHA256:/ {print $2; exit}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          if [ -z "$AAB_CERT_SHA256" ]; then
            echo "ERROR: Could not read AAB signing certificate."
            exit 1
          fi

          if [ "$EXPECTED_CERT_SHA256" != "$AAB_CERT_SHA256" ]; then
            echo "ERROR: AAB certificate does not match the release keystore."
            exit 1
          fi

          echo "AAB signing certificate matches the release keystore."

      # -------------------------------------------------
      # Build an APK set for size measurement.
      # Passwords are passed directly from environment
      # variables. Do not extract them using cut.
      # -------------------------------------------------
      - name: Build split APK set for size measurement
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=release_size_check.apks \
            --mode=default \
            --ks=android/release.keystore \
            "--ks-pass=pass:${KEYSTORE_PASSWORD}" \
            "--ks-key-alias=${KEY_ALIAS}" \
            "--key-pass=pass:${KEY_PASSWORD}"

          if [ ! -s release_size_check.apks ]; then
            echo "ERROR: APK set was not generated."
            exit 1
          fi

          echo "APK set successfully generated."

      # -------------------------------------------------
      # Calculate estimated download sizes.
      # -------------------------------------------------
      - name: Compute per-device download-size estimates
        run: |
          set -euo pipefail

          echo "--- Overall MIN/MAX (bytes) ---"

          java -jar bundletool.jar get-size total \
            --apks=release_size_check.apks \
            | tee size_total.csv

          echo ""
          echo "--- Breakdown by ABI (bytes) ---"

          java -jar bundletool.jar get-size total \
            --apks=release_size_check.apks \
            --dimensions=ABI \
            | tee size_by_abi.csv

          {
            echo "## تقدير حجم تنزيل تطبيق محفظتي"
            echo ""
            echo "الحجم محسوب باستخدام bundletool من ملفات APK المشتقة من AAB."
            echo "هذه تقديرات وقد تختلف عن الحجم النهائي المعروض في Google Play."
            echo ""
            echo "### الإجمالي: MIN / MAX"
            echo ""
            echo '```csv'
            cat size_total.csv
            echo '```'
            echo ""
            echo "### حسب معمارية المعالج (ABI)"
            echo ""
            echo '```csv'
            cat size_by_abi.csv
            echo '```'
            echo ""
            echo "التحويل إلى MiB: اقسم الحجم بالبايت على 1048576."
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------
      # Application metadata.
      # -------------------------------------------------
      - name: Read application metadata
        run: |
          set -euo pipefail

          echo "--- Application version ---"
          grep '^version:' pubspec.yaml

          echo "--- Android applicationId ---"
          grep "applicationId" \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null \
            | head -3 || true

      # -------------------------------------------------
      # Clean up temporary files.
      # -------------------------------------------------
      - name: Clean up temporary signing files
        if: always()
        run: |
          rm -f \
            android/release.keystore \
            android/key.properties \
            bundletool.jar \
            release_size_check.apks \
            size_total.csv \
            size_by_abi.csv \
            "$RUNNER_TEMP/release-key-test.csr"

      # -------------------------------------------------
      # Upload artifacts for manual download.
      # No automatic Google Play upload.
      # -------------------------------------------------
      - name: Upload signed AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: mahfazty-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
