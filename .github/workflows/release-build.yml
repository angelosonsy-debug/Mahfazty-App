name: Release Build (signed AAB)

# Release workflow:
# - Runs manually or when a v* tag is pushed.
# - Uses production signing secrets only in this workflow.
# - Does not upload automatically to Google Play.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter (pinned version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Full regression test suite
        run: flutter test

      # ---------------------------------------------------------------
      # Decode the production keystore from GitHub Secrets.
      # ---------------------------------------------------------------
      - name: Decode keystore from GitHub Secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/release.keystore

          if [ ! -s android/release.keystore ]; then
            echo "ERROR: Decoded keystore is empty."
            exit 1
          fi

      # ---------------------------------------------------------------
      # Write the signing configuration.
      # printf preserves characters such as '=' in secret values.
      # ---------------------------------------------------------------
      - name: Write key.properties from GitHub Secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${KEY_ALIAS:-}" ] || \
             [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "$KEYSTORE_PASSWORD" \
            "$KEY_PASSWORD" \
            "$KEY_ALIAS" > android/key.properties

      # ---------------------------------------------------------------
      # Build the signed release artifacts.
      # ---------------------------------------------------------------
      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Build Release APK for manual testing
        run: flutter build apk --release

      - name: Confirm AAB was actually produced
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB was not produced at $AAB_PATH"
            exit 1
          fi

          echo "AAB successfully produced."
          du -h "$AAB_PATH"

      # ---------------------------------------------------------------
      # Download bundletool and verify that it can run.
      # ---------------------------------------------------------------
      - name: Download bundletool
        run: |
          set -euo pipefail

          BUNDLETOOL_URL="$(
            curl -fsSL \
              https://api.github.com/repos/google/bundletool/releases/latest \
              | jq -r '[.assets[] | select(.name | test("^bundletool-all-.*\\.jar$"))][0].browser_download_url // empty'
          )"

          if [ -z "$BUNDLETOOL_URL" ]; then
            echo "ERROR: Could not find the official bundletool JAR."
            exit 1
          fi

          curl -fL --retry 3 \
            "$BUNDLETOOL_URL" \
            -o bundletool.jar

          if [ ! -s bundletool.jar ]; then
            echo "ERROR: Downloaded bundletool JAR is empty."
            exit 1
          fi

          java -jar bundletool.jar version

      # ---------------------------------------------------------------
      # Verify that the AAB signing certificate matches the certificate
      # belonging to the configured release-keystore alias.
      # ---------------------------------------------------------------
      - name: Verify AAB signing certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          EXPECTED_CERT_SHA256="$(
            keytool -exportcert \
              -keystore android/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              | sha256sum \
              | awk '{print $1}'
          )"

          # Verify the AAB's JAR signature and read its signer certificate.
          jarsigner -verify "$AAB_PATH"

          AAB_CERT_SHA256="$(
            keytool -printcert -jarfile "$AAB_PATH" \
              | awk '/SHA256:/ {print $2; exit}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          if [ -z "$AAB_CERT_SHA256" ]; then
            echo "ERROR: Could not read the AAB signing certificate."
            exit 1
          fi

          if [ "$EXPECTED_CERT_SHA256" != "$AAB_CERT_SHA256" ]; then
            echo "ERROR: AAB signing certificate does not match the configured release keystore."
            exit 1
          fi

          echo "AAB signing certificate matches the configured release keystore."

      # ---------------------------------------------------------------
      # Build an APK set using the release key.
      # Passwords are passed directly from environment variables.
      # Do NOT extract passwords with cut -d= -f2: passwords containing
      # '=' would be truncated.
      # ---------------------------------------------------------------
      - name: Build split APK set for download-size measurement
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          java -jar bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=release_size_check.apks \
            --mode=default \
            --ks=android/release.keystore \
            "--ks-pass=pass:${KEYSTORE_PASSWORD}" \
            "--ks-key-alias=${KEY_ALIAS}" \
            "--key-pass=pass:${KEY_PASSWORD}"

          if [ ! -s release_size_check.apks ]; then
            echo "ERROR: bundletool did not produce the APK set."
            exit 1
          fi

      # ---------------------------------------------------------------
      # Estimate compressed download size across device configurations.
      # These values are estimates, not a guarantee of the final
      # Google Play listing's displayed download size.
      # ---------------------------------------------------------------
      - name: Compute per-device download-size estimates
        run: |
          set -euo pipefail

          echo "--- Overall MIN/MAX across device configurations (bytes) ---"

          java -jar bundletool.jar get-size total \
            --apks=release_size_check.apks \
            | tee size_total.csv

          echo ""
          echo "--- Breakdown by ABI (bytes) ---"

          java -jar bundletool.jar get-size total \
            --apks=release_size_check.apks \
            --dimensions=ABI \
            | tee size_by_abi.csv

          {
            echo "## 📦 تقدير حجم تنزيل التطبيق"
            echo ""
            echo "الحجم محسوب باستخدام bundletool من ملفات APK المشتقة من الـ AAB."
            echo "النتيجة تقديرية وقد تختلف عن الحجم النهائي المعروض في Google Play."
            echo ""
            echo "### الإجمالي — أصغر وأكبر حجم محسوب"
            echo ""
            echo '```csv'
            cat size_total.csv
            echo '```'
            echo ""
            echo "### حسب معمارية المعالج (ABI)"
            echo ""
            echo '```csv'
            cat size_by_abi.csv
            echo '```'
            echo ""
            echo "الأحجام بالبايت. للتحويل إلى MiB اقسم الرقم على 1048576."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # Include application metadata in the workflow logs.
      # ---------------------------------------------------------------
      - name: Read application metadata
        run: |
          set -euo pipefail

          echo "--- pubspec.yaml version ---"
          grep '^version:' pubspec.yaml

          echo "--- applicationId ---"
          grep "applicationId" \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null \
            | head -3 || true

      # ---------------------------------------------------------------
      # Remove temporary signing files and measurement artifacts.
      # The GitHub-hosted runner is also discarded after the job ends.
      # ---------------------------------------------------------------
      - name: Clean up temporary signing files
        if: always()
        run: |
          rm -f \
            android/release.keystore \
            android/key.properties \
            bundletool.jar \
            release_size_check.apks \
            size_total.csv \
            size_by_abi.csv

      # ---------------------------------------------------------------
      # Publish the generated AAB and APK as downloadable workflow
      # artifacts. This does not upload anything to Google Play.
      # ---------------------------------------------------------------
      - name: Upload signed AAB and APK as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahfazty-release-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
