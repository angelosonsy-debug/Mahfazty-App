name: Generate Release Keystore (run once)

# ⚠️ يشتغل يدويًا بس (workflow_dispatch) — مفيش تريجر تلقائي أبدًا، عشان
# محدش يولّد Keystore جديد بالغلط فوق واحد موجود ومستخدم بالفعل.
#
# الـ Keystore بيتولّد جوه runner مؤقت تابع لـ GitHub نفسها، وبيتبعت
# كـ artifact مؤقت (بينمسح تلقائيًا بعد يوم واحد) — من غير ما يعدي على
# أي خدمة تالتة أو محادثة أبدًا. نزّله، انسخ القيم لـ Secrets، واحذفه.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'اسم الـ alias بتاع المفتاح'
        required: false
        default: 'mahfazty_key'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a fresh production keystore + strong random passwords
        run: |
          ALIAS="${{ inputs.key_alias }}"
          if [ -z "$ALIAS" ]; then
            ALIAS="mahfazty_key"
          fi

          # باسووردات عشوائية قوية (24 حرف، أرقام وحروف بس — عشان ما
          # تسبب مشاكل تفسير في ملفات .properties أو متغيرات shell لاحقًا)
          KEYSTORE_PASSWORD=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 24)
          KEY_PASSWORD=$(openssl rand -base64 32 | tr -dc 'a-zA-Z0-9' | head -c 24)

          keytool -genkeypair \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore release.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Mahfazty App, OU=Mahfazty, O=Mahfazty, L=Cairo, ST=Cairo, C=EG"

          KEYSTORE_BASE64=$(base64 -w0 release.keystore)

          {
            echo "ANDROID_KEYSTORE_BASE64=$KEYSTORE_BASE64"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > keystore-secrets.txt

          # تنظيف فوري — الملف الوحيد اللي هيتصعّد كـ artifact هو النص،
          # مش الملف الثنائي نفسه (مفيش داعي يتكرر، كل اللي محتاجينه
          # موجود في الـ base64 جوه النص).
          rm -f release.keystore

      - name: Upload the 4 secret values (download once from this page, then delete)
        uses: actions/upload-artifact@v4
        with:
          name: mahfazty-keystore-secrets
          path: keystore-secrets.txt
          retention-days: 1

      - name: Instructions
        run: |
          {
            echo "## ✅ تم توليد Keystore جديد"
            echo ""
            echo "**الخطوات التالية (مرة واحدة بس):**"
            echo ""
            echo "1. نزّل الـ artifact اسمه \`mahfazty-keystore-secrets\` من أسفل صفحة الـ run دي (Summary)"
            echo "2. افتح الملف \`keystore-secrets.txt\` — فيه 4 أسطر بالشكل \`KEY=VALUE\`"
            echo "3. روح لـ Settings → Secrets and variables → Actions → New repository secret"
            echo "   في الريبو بتاعك، وضيف كل سطر كـ Secret منفصل:"
            echo "   - \`ANDROID_KEYSTORE_BASE64\`"
            echo "   - \`KEYSTORE_PASSWORD\`"
            echo "   - \`KEY_ALIAS\`"
            echo "   - \`KEY_PASSWORD\`"
            echo "4. **احذف الـ artifact من صفحة الـ run دي بعد ما تخلّص** (زرار سلة"
            echo "   المهملات جنب اسم الـ artifact) — ومتحتفظش بنسخة في أي مكان تاني"
            echo "5. احفظ القيم الأربعة في password manager عندك — لو ضاعت، التطبيق"
            echo "   مينفعش يتحدّث تاني أبدًا بنفس التوقيع"
            echo ""
            echo "بعد كده شغّل \`release-build.yml\` عادي."
          } >> "$GITHUB_STEP_SUMMARY"
