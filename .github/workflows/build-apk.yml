name: Build Mahfazty

# ملحوظة مهمة: هذا الـ workflow مش بيعمل "flutter create" ولا "flutter
# pub add" إطلاقًا — المشروع نفسه (pubspec.yaml, pubspec.lock, android/)
# موجود بالفعل جوه الريبو (اتولّد مرة واحدة عبر bootstrap-android.yml).
# أي تشغيل هنا بياخد نفس الكود بالظبط ونفس نسخ الحزم بالظبط في كل مرة.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# لازم تتطابق دايمًا مع النسخة المستخدمة وقت آخر تشغيل لـ bootstrap-android.yml
env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter (pinned version — same version every run)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Get packages (uses the committed pubspec.lock — no resolution drift)
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Bootstrap android/ if missing (first-time setup)
        run: |
          if [ ! -d "android" ]; then
            echo "ℹ android/ not found — running bootstrap (first-time setup)..."
            flutter create --platforms=android --org com.mahfazty --project-name mahfazty /tmp/bootstrap_app
            cp -r /tmp/bootstrap_app/android android
            cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            mkdir -p android/app/src/main/kotlin/com/mahfazty/mahfazty
            cp android_overrides/kotlin/MainActivity.kt             android/app/src/main/kotlin/com/mahfazty/mahfazty/MainActivity.kt
            cp android_overrides/kotlin/MahfaztyNotificationListener.kt android/app/src/main/kotlin/com/mahfazty/mahfazty/MahfaztyNotificationListener.kt
            cp android_overrides/kotlin/SmsReceiver.kt              android/app/src/main/kotlin/com/mahfazty/mahfazty/SmsReceiver.kt
            BUILD_GRADLE="android/app/build.gradle.kts"
            [ ! -f "$BUILD_GRADLE" ] && BUILD_GRADLE="android/app/build.gradle"
            sed -i \
              -e 's/flutter\.compileSdkVersion/36/g' \
              -e 's/flutter\.targetSdkVersion/36/g' \
              -e 's/flutter\.minSdkVersion/23/g' \
              "$BUILD_GRADLE"
            python3 tool/apply_release_signing.py
            echo "✅ android/ bootstrapped successfully"
          else
            echo "✅ android/ already present"
          fi

          # حقن shim الخاص بـ google_mobile_ads — بيتنفذ هنا دايمًا
          # (سواء android/ جديدة أو موجودة من قبل) عشان لو كان مش محقون
          # في نسخة قديمة متحفوظة في الريبو. العملية idempotent بالكامل.
          cp android_overrides/gradle_patches/configurations_all_shim.gradle android/mahfazty_gma_shim.gradle
          cp android_overrides/gradle_patches/compile_sdk_enforcement.gradle android/mahfazty_compile_sdk_enforcement.gradle
          MARKER="// mahfazty: google_mobile_ads Gradle 8.11+ compatibility patch"
          ROOT_GRADLE="android/build.gradle.kts"
          PREFIX="android_overrides/gradle_patches/root_build_gradle_prefix.kts"
          if [ ! -f "$ROOT_GRADLE" ]; then
            ROOT_GRADLE="android/build.gradle"
            PREFIX="android_overrides/gradle_patches/root_build_gradle_prefix.gradle"
          fi
          if grep -qF "$MARKER" "$ROOT_GRADLE" 2>/dev/null; then
            echo "✅ google_mobile_ads Gradle shim already present in $ROOT_GRADLE (refreshed shim file)"
          else
            cat "$PREFIX" "$ROOT_GRADLE" > /tmp/patched_root_gradle
            mv /tmp/patched_root_gradle "$ROOT_GRADLE"
            echo "✅ Injected google_mobile_ads Gradle shim into $ROOT_GRADLE"
          fi

          # تفعيل core library desugaring (مطلوب لـ flutter_local_notifications)
          MARKER="// mahfazty: flutter_local_notifications requires core library desugaring"
          APP_GRADLE="android/app/build.gradle.kts"
          SUFFIX="android_overrides/gradle_patches/app_build_gradle_suffix.kts"
          if [ ! -f "$APP_GRADLE" ]; then
            APP_GRADLE="android/app/build.gradle"
            SUFFIX="android_overrides/gradle_patches/app_build_gradle_suffix.gradle"
          fi
          if grep -qF "$MARKER" "$APP_GRADLE" 2>/dev/null; then
            echo "✅ core library desugaring block already present in $APP_GRADLE"
          else
            cat "$SUFFIX" >> "$APP_GRADLE"
            echo "✅ Appended core library desugaring block to $APP_GRADLE"
          fi

      - name: Copy logo to icon-source.png (if missing)
        run: |
          if [ ! -f "icon-source.png" ]; then
            cp logo.png icon-source.png 2>/dev/null || echo "No logo.png — icon-source.png must be committed"
          fi
          if [ ! -f "icon-foreground.png" ]; then
            cp icon-source.png icon-foreground.png 2>/dev/null || true
          fi

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahfazty-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # -----------------------------------------------------------------------
  # reproducibility_check: بيئة نظيفة تانية بتتأكد إن حل الـ dependencies
  # نفس الحل بالظبط — المصدر + نسخ الحزم + نسخة Flutter كلهم ثابتين 100%.
  # -----------------------------------------------------------------------
  reproducibility_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter (same pinned version)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Confirm Flutter version matches the pin exactly
        run: |
          flutter --version | tee /tmp/flutter_version.txt
          grep -q "${{ env.FLUTTER_VERSION }}" /tmp/flutter_version.txt \
            || (echo "❌ Flutter version mismatch!" && exit 1)

      - name: pub get (verify lock is deterministic)
        run: |
          if [ -f pubspec.lock ]; then
            cp pubspec.lock /tmp/pubspec.lock.before
            flutter pub get
            diff /tmp/pubspec.lock.before pubspec.lock \
              && echo "✅ pubspec.lock unchanged — deterministic" \
              || (echo "❌ pubspec.lock drifted!" && exit 1)
          else
            echo "ℹ pubspec.lock not yet committed — run bootstrap-android.yml first"
            flutter pub get
          fi
