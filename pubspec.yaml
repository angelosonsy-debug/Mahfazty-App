name: mahfazty
description: "محفظتي — مدير مالي شخصي لمصر."
publish_to: 'none'

# مصدر واحد لرقم الإصدار: Flutter بيربط versionName بالجزء قبل "+"
# وversionCode بالجزء بعد "+" تلقائيًا في android/app/build.gradle
# (flutter.versionName / flutter.versionCode). لرفع إصدار جديد على
# Google Play: غيّر السطر ده بس (مثلاً 1.0.1+2) — من غير أي تعديل تاني
# في أي ملف Gradle.
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.5.0
  provider: ^6.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

# أيقونات التطبيق — بتتولّد من icon-source.png (الأيقونة العادية) و
# icon-foreground.png (طبقة الـ Adaptive Icon بمسافة أمان حواليها).
# الأمر: dart run flutter_launcher_icons  (الـ workflows بتشغّله قبل البناء)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon-source.png"
  min_sdk_android: 23
  adaptive_icon_background: "#16302B"
  adaptive_icon_foreground: "icon-foreground.png"
